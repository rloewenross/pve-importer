- name: Install dependencies
  ansible.builtin.package:
    name:
      - php8.4-fpm
      - php8.4-mysql
      - php8.4-xml
      - composer
      - mariadb-server
      - python3-pymysql
      - nginx
    state: present

- name: Create system group
  ansible.builtin.group:
    name: "{{ pve_importer_unix_user }}"
    system: true

- name: Create system user
  ansible.builtin.user:
    name: "{{ pve_importer_unix_user }}"
    group: "{{ pve_importer_unix_user }}"
    system: true

- name: Enable MariaDB
  ansible.builtin.service:
    name: mariadb
    enabled: true

- name: Create MariaDB database
  ansible.mariadb.mariadb_db:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: "{{ pve_importer_database_name }}"
    state: present

- name: Create MariaDB user
  ansible.mariadb.mariadb_user:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: "{{ pve_importer_database_user }}"
    password: "{{ pve_importer_database_password }}"
    priv: "{{ pve_importer_database_name }}.*:ALL"
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ pve_importer_install_path }}"
    state: directory
    owner: "{{ pve_importer_unix_user }}"
    group: "{{ pve_importer_unix_user }}"
    mode: "0755"

- name: Clone PVE-Importer Git repository
  ansible.builtin.git:
    repo: "{{ pve_importer_git_url }}"
    version: "{{ pve_importer_git_branch }}"
    dest: "{{ pve_importer_install_path }}"
  become: true
  become_user: "{{ pve_importer_unix_user }}"

- name: Ensure upload directory exists
  ansible.builtin.file:
    path: "{{ pve_importer_upload_dir }}"
    state: directory
    owner: "{{ pve_importer_unix_user }}"
    group: "{{ pve_importer_unix_user }}"
    mode: "0700"

- name: Install .env.local
  ansible.builtin.template:
    src: env.local.j2
    dest: "{{ pve_importer_install_path }}/.env.local"
    owner: "{{ pve_importer_unix_user }}"
    group: "{{ pve_importer_unix_user }}"
    mode: "0600"

- name: Install composer dependencies
  ansible.builtin.command:
    chdir: "{{ pve_importer_install_path }}"
    cmd: composer install --no-dev --optimize-autoloader
  become: true
  become_user: "{{ pve_importer_unix_user }}"
  register: pve_importer_composer_install_result
  changed_when: pve_importer_composer_install_result.rc != 0

- name: Run Doctrine migrations
  ansible.builtin.command:
    chdir: "{{ pve_importer_install_path }}"
    cmd: php bin/console doctrine:migrations:migrate --no-interaction
  become: true
  become_user: "{{ pve_importer_unix_user }}"
  register: pve_importer_migrate_result
  changed_when: pve_importer_migrate_result.rc != 0

- name: Install PHP-FPM pool configuration
  ansible.builtin.template:
    src: pve_importer.php-pool.j2
    dest: /etc/php/8.4/fpm/pool.d/pve_importer.conf
    mode: "0640"

- name: Enable PHP-FPM
  ansible.builtin.service:
    name: php8.4-fpm
    enabled: true
    state: restarted

- name: Install nginx configuration
  ansible.builtin.template:
    src: pve_importer.nginx.j2
    dest: /etc/nginx/sites-available/pve_importer
    mode: "0640"

- name: Enable nginx configuration
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/pve_importer
    state: link
    src: /etc/nginx/sites-available/pve_importer

- name: Remove nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Enable nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: restarted
